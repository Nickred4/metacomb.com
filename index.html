:root{
  --ink:#151513;
  --gray-1:#6B6A65;
  --gray-2:#9C9B95;
  --line:#E3E1DA;
  --hex-fill:#F1EEE5;
  --amber:#C4761E;
  --bronze:#7A4E22;
  --cement:#8F9390;
}
*{ box-sizing:border-box; }
body{ background:#fff; color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
.bleed{ margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw); width:100vw; }
a{ color:inherit; }

.topnav{ display:flex; align-items:center; justify-content:space-between; padding:1.5rem 0; }
.brand{ font-weight:800; font-size:1.4rem; letter-spacing:-0.02em; }
.brand small{ display:block; font-weight:400; font-size:.68rem; color:var(--gray-1); letter-spacing:0; }
.topnav-links{ display:flex; gap:2.25rem; font-size:.95rem; }
.topnav-links > a{ text-decoration:none; }
.topnav-links > a:hover{ color:var(--amber); }
@media (max-width:900px){ .topnav-links{ display:none; } }

.nav-item{ position:relative; }
.nav-item > .nav-trigger{
  display:flex; align-items:center; gap:.3rem;
  cursor:pointer; text-decoration:none; background:none; border:none;
  font-size:.95rem; font-family:inherit; color:inherit; padding:0;
}
.nav-item > .nav-trigger:hover{ color:var(--amber); }
.nav-item > .nav-trigger .caret{ font-size:.6rem; margin-top:2px; color:var(--gray-2); transition:transform .15s ease; }
.nav-item:hover > .nav-trigger .caret{ transform:rotate(180deg); }

.nav-dropdown{
